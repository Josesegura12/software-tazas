<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mi Negocio · Administración</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <button class="btn sm" id="menuBtn" aria-label="Abrir menú">☰</button>
    <span class="logo" id="brandLogo">S</span>
    <span id="brandName">Mi Negocio</span>
  </div>
  <div class="top-tools">
    <a class="btn sm hide-m" href="../index.html" target="_blank" rel="noopener">🎨 Editor de diseño</a>
    <a class="btn sm hide-m" href="../tienda/" target="_blank" rel="noopener">🛍️ Ver tienda</a>
    <button class="btn sm" id="btnBackup">💾 Respaldo</button>
  </div>
</header>

<div class="layout">
  <nav class="side" id="nav" aria-label="Módulos">
    <button data-view="panel"><span class="i">🏠</span>Panel</button>
    <button data-view="pos"><span class="i">💵</span>Venta rápida</button>
    <button data-view="pedidos"><span class="i">📋</span>Cotizaciones y pedidos</button>
    <button data-view="clientes"><span class="i">👥</span>Clientes</button>
    <button data-view="productos"><span class="i">☕</span>Productos</button>
    <button data-view="inventario"><span class="i">📦</span>Inventario de insumos</button>
    <button data-view="gastos"><span class="i">🧾</span>Gastos y compras</button>
    <button data-view="calc"><span class="i">🧮</span>Calculadora de precios</button>
    <button data-view="calendario"><span class="i">📅</span>Calendario de entregas</button>
    <button data-view="reportes"><span class="i">📊</span>Reportes</button>
    <button data-view="config"><span class="i">⚙️</span>Configuración</button>
  </nav>
  <main id="main">
    <div class="empty-msg"><span class="big">⏳</span>Cargando tu información…</div>
  </main>
</div>

<dialog class="modal" id="modal"></dialog>
<div id="toasts" aria-live="polite"></div>
<div id="printArea"></div>
<input type="file" id="fileImport" accept=".json,application/json" hidden>

<script src="app.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('../sw.js').catch(() => {});</script>
</body>
</html>
